[workspace]
members = ["crates/core"]
resolver = "3"

[package]
name = "skylint"
version = "0.2.0"
edition = "2024"
# oxc 0.155 的 oxc_parser / oxc_ast / oxc_allocator 声明 rust-version = 1.97。
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/wechat-miniprogram/skylint"
description = "Skyline 小程序迁移检查工具"
readme = "README.md"
keywords = ["miniprogram", "wechat", "skyline", "lint"]
categories = ["development-tools"]

[dependencies]
# 引擎：工程加载、解析、选择器匹配、规则。CLI 只是它的一个集成。
skylint-core = { path = "crates/core", version = "0.2.0" }
clap = { version = "4", features = ["derive", "wrap_help"] }
# 终端渲染：源码片段 + caret。fancy-no-backtrace 不带 backtrace，够用。
miette = { version = "7.6", default-features = false, features = ["fancy-no-backtrace"] }
