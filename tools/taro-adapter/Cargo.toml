[package]
name = "skylint-taro"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "skylint 的 Taro 适配器：把 TSX 还原成可检查的 WXML 后交给 skylint"

[[bin]]
name = "skylint-taro"
path = "src/main.rs"

[dependencies]
skylint = { path = "../.." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

# 与 skylint 共用同一条 oxc 0.155 版本线（不同版本无法共享 Allocator）。
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
