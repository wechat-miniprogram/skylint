[workspace]
resolver = "2"
members = ["crates/skylint-core", "crates/skylint-cli", "crates/xtask"]

[workspace.package]
version = "2.0.0"
edition = "2024"
# oxc 0.155 的 oxc_parser / oxc_ast / oxc_allocator 声明 rust-version = 1.97。
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/wechat-miniprogram/skylint"

[workspace.dependencies]
skylint-core = { path = "crates/skylint-core" }

# 终端渲染：与 minidev 的错误出口同一套（GraphicalReportHandler）。
# fancy-no-backtrace 不带 backtrace，够渲染源码片段 + caret。
miette = { version = "7.6", default-features = false, features = ["fancy-no-backtrace"] }

anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
