[package]
name = "skylint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Skyline 迁移检查核心：工程图、输入解析、规则、诊断"

[dependencies]
common = { workspace = true }
diag = { workspace = true }
miette = { workspace = true }
compiler-graph = { workspace = true }

anyhow = { workspace = true }
glass-easel-template-compiler = "1.2.0"
# 0.0.x 会有破坏性变更，必须精确锁版本。
oxc-css-parser = "=0.0.17"
serde = { workspace = true }
serde_json = { workspace = true }
# JS / TS 前端。与 oxc-css-parser 复用同一条 0.155 版本线（同一套 Allocator），
# 同样是 0.x，全部精确锁版本，避免 allocator 跨版本混用。
oxc_parser = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_allocator = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
